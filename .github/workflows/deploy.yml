name: Deploy to EC2

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./koundinyasa-exam-portal/backend
          push: true
          tags: |
            heysaikrishna/exam-portal-backend:latest
            heysaikrishna/exam-portal-backend:${{ github.event.workflow_run.head_sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./koundinyasa-exam-portal/frontend
          push: true
          tags: |
            heysaikrishna/exam-portal-frontend:latest
            heysaikrishna/exam-portal-frontend:${{ github.event.workflow_run.head_sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DEPLOY_SHA
          script: |
            set -eu

            cd /home/ubuntu/test-_demo
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            cd koundinyasa-exam-portal

            sudo docker compose pull backend frontend
            sudo docker compose up -d --no-build --remove-orphans
            sudo docker compose ps

            for i in $(seq 1 30); do
              if curl -fsS http://localhost/api/health; then
                echo "Deployment health check passed."
                exit 0
              fi
              sleep 2
            done

            echo "Deployment health check failed."
            sudo docker compose logs --tail=100 backend frontend
            exit 1
